# Builds the Vite app and publishes dist/ to Cloudflare Pages (Direct Upload).
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # Account token: Account → Cloudflare Pages → Edit
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=whofunds --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      # User token: Zone → Cache Purge → Purge, Zone Resources include whofunds.nz
      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CLOUDFLARE_ZONE_ID: fadc2d61029b2c97c410688fbc557f0f
        run: |
          response="$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_CACHE_PURGE_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')"
          echo "$response"
          if ! echo "$response" | grep -q '"success":true'; then
            echo "::error::Cache purge failed. Check CLOUDFLARE_CACHE_PURGE_TOKEN has Zone → Cache Purge → Purge for whofunds.nz."
            exit 1
          fi
          echo "Cache purged."
