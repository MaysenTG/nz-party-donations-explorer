# Builds the Vite app and publishes a preview to Cloudflare Pages (Direct Upload).
# All PR builds share the preview branch alias, served at https://preview.whofunds.nz
name: Cloudflare Pages preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: cloudflare-pages-preview
  cancel-in-progress: true

jobs:
  preview:
    # Direct Upload secrets are not available to workflows from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # Account token: Account → Cloudflare Pages → Edit
      # Deploy to the fixed "preview" branch so the custom domain stays stable.
      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=whofunds --branch=preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      # Custom domain can keep a cached production response unless we purge it.
      - name: Purge preview.whofunds.nz cache
        env:
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CLOUDFLARE_ZONE_ID: fadc2d61029b2c97c410688fbc557f0f
        run: |
          response="$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_CACHE_PURGE_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"hosts":["preview.whofunds.nz","preview.whofunds.pages.dev"]}')"
          echo "$response"
          if ! echo "$response" | grep -q '"success":true'; then
            echo "::error::Preview cache purge failed."
            exit 1
          fi
      - name: Comment preview URL
        uses: actions/github-script@v8
        with:
          script: |
            const url = "https://preview.whofunds.nz";
            const pagesUrl = "https://preview.whofunds.pages.dev";
            const marker = "<!-- whofunds-preview -->";
            const body = [
              marker,
              "### Preview",
              "",
              `- [${url.replace("https://", "")}](${url})`,
              `- Fallback: [${pagesUrl.replace("https://", "")}](${pagesUrl})`,
              "",
              "Includes this pull request's branch. Concurrent open PRs overwrite the same URL.",
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
