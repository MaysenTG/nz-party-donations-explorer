<!doctype html>
<html lang="en-NZ">

      }
      * {

        max-width: 40rem;
        margin: 12vh auto;
        padding: 2rem 1.5rem;
        line-height: 1.55;
      }
      .brand {
        margin: 0 0 0.75rem;
        font-size: 0.95rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--accent);
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.8rem, 5vw, 2.4rem);
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 0.9rem;
        font-family: system-ui, sans-serif;
        color: var(--muted);
      }
      a {
        color: var(--accent);
      }
